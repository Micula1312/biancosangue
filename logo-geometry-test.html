<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOP Geometry Test</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#090909;font:12px Arial,sans-serif}.top{height:54px;border-bottom:1px solid;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.note{color:#777}.grid{display:grid;grid-template-columns:repeat(3,1fr);height:calc(100vh - 54px)}section{position:relative;border-right:1px solid #ddd;overflow:hidden}h2{position:absolute;z-index:2;top:12px;left:16px;font-size:11px;letter-spacing:.1em;font-weight:500}.sub{position:absolute;z-index:2;bottom:14px;left:16px;right:16px;color:#666;line-height:1.4}canvas{width:100%;height:100%}@media(max-width:800px){.grid{grid-template-columns:1fr;height:auto}section{height:55vh;border-bottom:1px solid #ddd}}</style></head><body><div class="top"><b>LOOP / GEOMETRY TEST</b><span class="note">esperimento isolato · non modifica il lab</span></div><div class="grid"><section><h2>01 · MASTER</h2><canvas id="master"></canvas><div class="sub">SVG Bézier attuale</div></section><section><h2>02 · RAW</h2><canvas id="raw"></canvas><div class="sub">stesso gesto, campionato e perturbato lungo la normale</div></section><section><h2>03 · STEPPED</h2><canvas id="step"></canvas><div class="sub">stesso gesto ricostruito come geometria a scalini, non tratteggio</div></section></div><svg width="0" height="0" style="position:absolute"><path id="mp"/></svg><script>const D=`M117.35 102.10C131 82 158 43 178.5 25C194 11.5 208 17 209 35.5C210 54.5 192.5 65.5 172 64.5C149.5 63.5 132.5 54.5 122.4 49.4C116 45.8 112.8 38 114.2 31.8C115.8 24.7 123.1 21.6 128.7 24.7C135.1 28.2 136.2 36.3 131.6 41.8C126.8 47.5 117.9 50.6 105.5 51.2C93.1 51.8 84.2 54.9 79.4 60.6C74.8 66.1 75.9 74.2 82.3 77.7C87.9 80.8 95.2 77.7 96.8 70.6C98.2 64.4 95 56.6 88.6 53C78.5 47.9 61.5 38.9 39 37.9C18.5 36.9 1 47.9 2 66.9C3 85.4 17 90.9 32.5 77.4C53 59.4 80 20.4 93.65 .3`;const p=document.getElementById('mp');p.setAttribute('d',D);const L=p.getTotalLength();function setup(id){let c=document.getElementById(id),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let x=c.getContext('2d');x.scale(d,d);return{x,w:r.width,h:r.height}}function basePoints(n,w,h){let a=[];for(let i=0;i<=n;i++){let q=p.getPointAtLength(L-L*i/n);a.push({x:w*.5+(q.x-105)*Math.min(w/280,h/190),y:h*.5+(q.y-51)*Math.min(w/280,h/190)})}return a}function stroke(ctx,a,w=7){ctx.lineWidth=w;ctx.strokeStyle='#090909';ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();a.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y));ctx.stroke()}function draw(){let A=setup('master'),B=setup('raw'),C=setup('step');stroke(A.x,basePoints(360,A.w,A.h));let r=basePoints(110,B.w,B.h).map((q,i,a)=>{let prev=a[Math.max(0,i-1)],next=a[Math.min(a.length-1,i+1)],dx=next.x-prev.x,dy=next.y-prev.y,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;let jitter=Math.sin(i*1.73)*2.8+Math.sin(i*.41+2)*5.2+Math.sin(i*.13)*2;return{x:q.x+nx*jitter,y:q.y+ny*jitter}});stroke(B.x,r,7);let src=basePoints(72,C.w,C.h),unit=11,s=[];src.forEach((q,i)=>{let x=Math.round(q.x/unit)*unit,y=Math.round(q.y/unit)*unit;if(!i){s.push({x,y});return}let z=s[s.length-1];if(x!==z.x&&y!==z.y){s.push({x,y:z.y});s.push({x,y})}else if(x!==z.x||y!==z.y)s.push({x,y})});C.x.lineCap='square';C.x.lineJoin='miter';stroke(C.x,s,7)}draw();addEventListener('resize',()=>location.reload());</script></body></html>
