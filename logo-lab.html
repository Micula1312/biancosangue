<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOP — Logo Lab</title>
<style>:root{--bg:#f6f4ee;--ink:#0a0a0a;--line:#c9c5bb;--panel:#ece8df;--muted:#6d6a63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.app{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:100vh}.stage{padding:24px;display:flex;flex-direction:column;gap:16px}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:12px}.top h1{margin:0;font-size:18px;letter-spacing:.16em}.top small{color:var(--muted)}.canvas-wrap{flex:1;min-height:620px;border:1px solid var(--line);background:#fff;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.canvas-wrap canvas{display:block;max-width:100%;max-height:100%;object-fit:contain}.saved{display:flex;gap:10px;overflow:auto}.thumb{width:110px;height:72px;border:1px solid var(--line);background:#fff}.thumb canvas{width:100%;height:100%}aside{border-left:1px solid var(--line);background:var(--panel);padding:18px;overflow:auto}.section{padding:14px 0;border-top:1px solid var(--line)}.section:first-child{border-top:0}.section h2{font-size:11px;letter-spacing:.12em;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:10px 0}.row label{font-size:12px}.row span{font-size:11px;color:var(--muted)}input[type=range]{width:100%}.stack{display:grid;gap:8px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,select,input[type=text]{font:inherit;border:1px solid #999;background:#fff;color:#111;padding:8px}button{cursor:pointer}.primary{background:#111;color:#fff}.full{grid-column:1/-1}.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.seg button.active{background:#111;color:#fff}.icon-preview{height:120px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}.icon-preview canvas{width:100%;height:100%}@media(max-width:900px){.app{grid-template-columns:1fr}.canvas-wrap{min-height:460px}aside{border-left:0;border-top:1px solid var(--line)}}</style></head><body>
<div class="app"><section class="stage"><div class="top"><div><h1>LOOP / LOGO LAB</h1><small>simbolo, texture & type</small></div><small>master LOOP · canvas 1400×900 fisso</small></div><div class="canvas-wrap"><canvas id="canvas" width="1400" height="900"></canvas></div><div class="saved" id="saved"></div></section><aside>
<div class="section"><h2>01 · PRESET</h2><div class="seg" id="presetBtns"><button data-preset="clean" class="active">clean</button><button data-preset="charcoal">carboncino</button><button data-preset="spray">spray</button><button data-preset="dry">dry brush</button></div></div>
<div class="section"><h2>02 · SIMBOLO</h2><div class="row"><label>Spessore</label><span id="thicknessV"></span></div><input id="thickness" type="range" min="0.85" max="1.25" step="0.005" value="1"><div class="row"><label>Roughness</label><span id="roughnessV"></span></div><input id="roughness" type="range" min="0" max="1" step="0.01" value="0.15"><div class="row"><label>Grain</label><span id="grainV"></span></div><input id="grain" type="range" min="0" max="1" step="0.01" value="0.15"><div class="row"><label>Erosion</label><span id="erosionV"></span></div><input id="erosion" type="range" min="0" max="1" step="0.01" value="0.05"><div class="row"><label>Scala</label><span id="scaleV"></span></div><input id="scale" type="range" min="0.45" max="1.25" step="0.01" value="0.82"><div class="row"><label>Rotazione</label><span id="rotationV"></span></div><input id="rotation" type="range" min="-20" max="20" step="1" value="0"></div>
<div class="section"><h2>03 · STRINGA</h2><div class="stack"><input id="tagline" type="text" value="movimento e pensiero"><select id="font"><option value="Arial">Arial</option><option value="Helvetica">Helvetica</option><option value="Arial Black">Arial Black</option><option value="Trebuchet MS">Trebuchet MS</option></select><select id="layout"><option value="fragment">frammento</option><option value="continuation">prosecuzione</option><option value="cross">attraversamento</option><option value="orbital">orbitale</option></select></div><div class="row"><label>Dimensione</label><span id="fontSizeV"></span></div><input id="fontSize" type="range" min="18" max="72" value="32"><div class="row"><label>Tracking</label><span id="trackingV"></span></div><input id="tracking" type="range" min="0" max="18" value="3"></div>
<div class="section"><h2>04 · ICONA</h2><div class="icon-preview"><canvas id="iconCanvas" width="520" height="220"></canvas></div></div><div class="section"><h2>05 · OUTPUT</h2><div class="btns"><button id="randomBtn">RANDOMIZE</button><button id="saveBtn">★ SAVE</button><button id="pngBtn" class="primary">PNG TRASP.</button><button id="svgBtn" class="primary">SVG COMPLETO</button><button id="iconBtn">ICON PNG</button><button id="resetBtn">RESET</button></div></div></aside></div>
<script>
const pathD="M 117.35 102.10 C 131 82,158 43,178.5 25 C 194 11.5,208 17,209 35.5 C 210 54.5,192.5 65.5,172 64.5 C 149.5 63.5,132.5 54.5,122.4 49.4 C 116 45.8,112.8 38,114.2 31.8 C 115.8 24.7,123.1 21.6,128.7 24.7 C 135.1 28.2,136.2 36.3,131.6 41.8 C 126.8 47.5,117.9 50.6,105.5 51.2 C 93.1 51.8,84.2 54.9,79.4 60.6 C 74.8 66.1,75.9 74.2,82.3 77.7 C 87.9 80.8,95.2 77.7,96.8 70.6 C 98.2 64.4,95 56.6,88.6 53 C 78.5 47.9,61.5 38.9,39 37.9 C 18.5 36.9,1 47.9,2 66.9 C 3 85.4,17 90.9,32.5 77.4 C 53 59.4,80 20.4,93.65 .3";
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),ic=document.getElementById('iconCanvas'),ictx=ic.getContext('2d');const ids=['thickness','roughness','grain','erosion','scale','rotation','fontSize','tracking'];
function v(id){return +document.getElementById(id).value}function txt(id){return document.getElementById(id).value}function sync(){ids.forEach(id=>{let e=document.getElementById(id+'V');if(e)e.textContent=document.getElementById(id).value})}function seeded(i){let x=Math.sin(i*999+17.13)*43758.5453;return x-Math.floor(x)}
function makeSymbolSVG(){let sw=1.8*v('thickness');return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 211 102.4"><path d="${pathD}" fill="none" stroke="#000" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function symbolImage(){let im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(makeSymbolSVG());return im}
function drawLogo(g,icon=false,transparent=false){let W=g.canvas.width,H=g.canvas.height;g.clearRect(0,0,W,H);if(!transparent){g.fillStyle='#fff';g.fillRect(0,0,W,H)}let im=symbolImage();im.onload=()=>{let sc=(icon?.62:v('scale'))*(W/900),cx=icon?W*.5:W*.48,cy=icon?H*.52:H*.46;g.save();g.translate(cx,cy);g.rotate(v('rotation')*Math.PI/180);g.scale(sc,sc);let reps=Math.round(1+v('roughness')*9);for(let i=0;i<reps;i++){let j=(seeded(i)-.5)*v('roughness')*9;g.globalAlpha=.94-v('erosion')*.3*seeded(i+4);g.drawImage(im,-430+j,-210+j*.3,860,420)}g.restore();let grains=Math.round(v('grain')*2200);g.fillStyle='rgba(0,0,0,.34)';for(let i=0;i<grains;i++){let x=seeded(i+10)*W,y=seeded(i+2000)*H;if(seeded(i+4000)>.74)g.fillRect(x,y,seeded(i+5)*1.8+.2,seeded(i+9)*1.8+.2)}if(!icon)drawTagline(g,W,H)}}
function drawTagline(g,W,H){let text=txt('tagline'),size=v('fontSize'),track=v('tracking'),font=txt('font'),layout=txt('layout');g.fillStyle='#111';g.globalAlpha=1;g.font=`600 ${size}px ${font}`;let chars=[...text],width=chars.reduce((a,ch)=>a+g.measureText(ch).width+track,0)-track,x=W*.58,y=H*.67,angle=0;if(layout==='continuation'){x=W*.56;y=H*.66;angle=-.08}else if(layout==='cross'){x=W*.5-width/2;y=H*.5}else if(layout==='orbital'){g.save();g.translate(W*.5,H*.47);let r=Math.min(W,H)*.28;chars.forEach((ch,i)=>{let a=-2.6+i/(chars.length-1)*2.1;g.save();g.rotate(a+Math.PI/2);g.translate(r,0);g.rotate(Math.PI/2);g.fillText(ch,0,0);g.restore()});g.restore();return}g.save();g.translate(x,y);g.rotate(angle);if(layout==='fragment')g.fillRect(-90,-size*.35,65,1);let px=0;chars.forEach(ch=>{g.fillText(ch,px,0);px+=g.measureText(ch).width+track});g.restore()}
function render(){sync();drawLogo(ctx,false,false);drawLogo(ictx,true,false)}function preset(n){document.querySelectorAll('#presetBtns button').forEach(b=>b.classList.toggle('active',b.dataset.preset===n));let p={clean:[1,.03,.02,.01],charcoal:[.9,.55,.55,.18],spray:[1,.35,.92,.28],dry:[.92,.72,.38,.22]}[n];['thickness','roughness','grain','erosion'].forEach((id,i)=>document.getElementById(id).value=p[i]);render()}
ids.forEach(id=>document.getElementById(id).addEventListener('input',render));['tagline','font','layout'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.querySelectorAll('#presetBtns button').forEach(b=>b.onclick=()=>preset(b.dataset.preset));document.getElementById('randomBtn').onclick=()=>{document.getElementById('roughness').value=(Math.random()*.85).toFixed(2);document.getElementById('grain').value=Math.random().toFixed(2);document.getElementById('erosion').value=(Math.random()*.35).toFixed(2);render()};document.getElementById('saveBtn').onclick=()=>{let d=document.createElement('div'),t=document.createElement('canvas');d.className='thumb';t.width=330;t.height=216;d.appendChild(t);document.getElementById('saved').appendChild(d);drawLogo(t.getContext('2d'),false,false)};
function downloadBlob(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.getElementById('pngBtn').onclick=()=>{let out=document.createElement('canvas');out.width=c.width;out.height=c.height;drawLogo(out.getContext('2d'),false,true);setTimeout(()=>out.toBlob(b=>downloadBlob(b,'loop-logo-transparent.png'),'image/png'),100)};document.getElementById('iconBtn').onclick=()=>{let out=document.createElement('canvas');out.width=520;out.height=220;drawLogo(out.getContext('2d'),true,true);setTimeout(()=>out.toBlob(b=>downloadBlob(b,'loop-icon-transparent.png'),'image/png'),100)};
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}document.getElementById('svgBtn').onclick=()=>{let layout=txt('layout'),tag=esc(txt('tagline')),sw=1.8*v('thickness'),scale=v('scale')*4.5,rot=v('rotation'),symbol=`<g transform="translate(250 170) rotate(${rot}) scale(${scale}) translate(-105.5 -51.2)"><path d="${pathD}" fill="none" stroke="#000" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></g>`,tagEl='';if(layout==='fragment')tagEl=`<line x1="480" y1="315" x2="545" y2="315" stroke="#000" stroke-width="1"/><text x="565" y="325" font-family="${esc(txt('font'))},sans-serif" font-size="${v('fontSize')}" font-weight="600" letter-spacing="${v('tracking')}">${tag}</text>`;else if(layout==='cross')tagEl=`<text x="350" y="220" font-family="${esc(txt('font'))},sans-serif" font-size="${v('fontSize')}" font-weight="600" letter-spacing="${v('tracking')}">${tag}</text>`;else tagEl=`<text x="540" y="320" transform="rotate(-5 540 320)" font-family="${esc(txt('font'))},sans-serif" font-size="${v('fontSize')}" font-weight="600" letter-spacing="${v('tracking')}">${tag}</text>`;let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">${symbol}${tagEl}</svg>`;downloadBlob(new Blob([svg],{type:'image/svg+xml'}),'loop-logo-completo.svg')};document.getElementById('resetBtn').onclick=()=>preset('clean');render();
</script></body></html>
