olor:#111;border-radius:0}@media(max-width:900px){.app{display:block;height:auto}.wrap{height:60vh}aside{border-left:0}.out{width:100%}}</style></head><body><div class="app"><main class="stage"><div class="top"><b>LOOP / IDENTITY LAB</b><div class="mode"><button id="freeMode" class="active">FREE</button><button id="corporateMode">CORPORATE</button></div></div><div class="wrap"><canvas id="bg" width="1400" height="900"></canvas><canvas id="cv" width="1400" height="900"></canvas></div><div id="saved" class="saved"></div></main><aside><section class="sec"><h2>01 · TRACCIATO</h2><div class="g" id="presets"><button data-p="clean" class="active">clean</button><button data-p="blocks">mattoncini</button><button data-p="rough">irregolare</button><button data-p="pencil">matita</button></div><div class="row"><label>Spessore</label><span id="thicknessV"></span></div><input id="thickness" type="range" min="1" max="14" step=".1" value="6"><div class="row"><label>Irregolarità</label><span id="roughV"></span></div><input id="rough" type="range" min="0" max="1" step=".01" value=".08"><div class="row"><label>Scala</label><span id="scaleV"></span></div><input id="scale" type="range" min=".4" max="1.3" step=".01" value=".82"><input id="baseColor" type="color" value="#090909"></section><section class="sec"><h2>02 · TYPE</h2><input id="tagline" value="movimento e pensiero" style="width:100%"><select id="font" style="width:100%;margin-top:5px"><option>Roboto Flex</option><option selected>Helvetica Now Display</option><option>Arial Narrow</option><option>Courier New</option></select><select id="layout" style="width:100%;margin-top:5px"><option value="free">lineare</option><option value="twoline">due righe</option><option value="arc">ARC · segue il LOOP</option></select><div class="row"><label>Peso</label><span id="weightV"></span></div><input id="weight" type="range" min="100" max="1000" step="10" value="200"><div class="row"><label>Dimensione</label><span id="sizeV"></span></div><input id </div><input id="iconScale" type="range" min=".5" max="1.5" step=".01" value="1"><div class="g" style="margin-top:8px"><button id="iconPng" class="primary">ICON PNG</button><button id="iconPngTransparent">ICON TRASP</button></div></section><div class="out"><div class="g"><button id="png" class="primary">LOGO PNG · TRASP</button><button id="canvas" class="primary">SAVE CANVAS PNG</button><button id="saveDefault">★ SET AS DEFAULT</button><button id="factory">FACTORY DEFAULT</button><button id="save">★ SAVE CANVAS</button><button id="resetCurrent">RESET CURRENT</button><div id="defaultStatus" class="defaultStatus">default: factory</div></div></div></aside></div><svg width="0" height="0"><path id="mp"/></svg><script>const D=`M117.35 102.10C131 82 158 43 178.5 25C194 11.5 208 17 209 35.5C210 54.5 192.5 65.5 172 64.5C149.5 63.5 132.5 54.5 122.4 49.4C116 45.8 112.8 38 114.2 31.8C115.8 24.7 123.1 21.6 128.7 24.7C135.1 28.2 136.2 36.3 131.6 41.8C126.8 47.5 117.9 50.6 105.5 51.2C93.1 51.8 84.2 54.9 79.4 60.6C74.8 66.1 75.9 74.2 82.3 77.7C87.9 80.8 95.2 77.7 96.8 70.6C98.2 64.4 95 56.6 88.6 53C78.5 47.9 61.5 38.9 39 37.9C18.5 36.9 1 47.9 2 66.9C3 85.4 17 90.9 32.5 77.4C53 59.4 80 20.4 93.65 .3`,$=x=>document.getElementById(x),cv=$('cv'),g=cv.getContext('2d'),bg=$('bg'),b=bg.getContext('2d'),ic=$('icon'),ig=ic.getContext('2d'),mp=$('mp');mp.setAttribute('d',D);const L=mp.getTotalLength(),STORE='loopIdentityLabDefaultsV3',mask=document.createElement('canvas'),mx=mask.getContext('2d');mask.width=1400;mask.height=900;let preset='clean',mode='free',drawing=false,prog=1,strobe=false,flash=false,electric=false,last=0,bl=[];const ids=['thickness','rough','scale','weight','size','tracking','textX','textY','arcStart','arcOffset','drawSpeed','strobeSpeed','echoCount','echoX','echoY','blobCount','blobSpeed','filamentCount','filamentOpacity','gridStep','safeArea','iconScale'];const stateIds=['thickness','rough','scale','baseColor','tagline','font','layout','weight','size','tracking','textX
