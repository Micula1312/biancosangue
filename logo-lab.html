<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOP Identity Lab</title><link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@100..1000&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font:12px 'Roboto Flex',Arial;background:#fff;color:#090909}.app{height:100vh;display:grid;grid-template-columns:1fr 390px}.stage{padding:14px;display:grid;grid-template-rows:auto 1fr 70px;gap:10px}.top{display:flex;justify-content:space-between;border-bottom:1px solid;padding:8px 0}.wrap{position:relative;border:1px solid #ddd;overflow:hidden;background:#fff;display:grid;place-items:center}.wrap canvas{position:absolute;width:100%;height:100%;object-fit:contain}.saved{display:flex;gap:8px;overflow:auto}.saved canvas{width:105px;height:68px;border:1px solid #ddd}aside{overflow:auto;border-left:1px solid;padding:0 14px 150px}.sec{padding:12px 0;border-bottom:1px solid #ddd}h2{font-size:10px;letter-spacing:.12em}.g{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}button,select,input{font:inherit;background:#fff;border:1px solid #aaa;padding:6px}button{cursor:pointer}.active,.primary{background:#090909;color:#fff}.row{display:grid;grid-template-columns:1fr auto;gap:8px;margin:7px 0}input[type=range]{width:100%}.out{position:fixed;right:0;bottom:0;width:390px;background:#fff;border-top:3px solid #ef4b32;padding:10px 14px}.arc{display:none}.arc.on{display:block}.status{font-size:10px;color:#666;margin-top:8px}.defaultStatus{grid-column:1/-1;font-size:10px;color:#666;padding-top:3px}@media(max-width:900px){.app{display:block;height:auto}.wrap{height:60vh}aside{border-left:0}.out{width:100%}}</style></head><body><div class="app"><main class="stage"><div class="top"><b>LOOP / IDENTITY LAB</b><span>flat system · live</span></div><div class="wrap"><canvas id="bg" width="1400" height="900"></canvas><canvas id="cv" width="1400" height="900"></canvas></div><div id="saved" class="saved"></div></main><aside><section class="sec"><h2>01 · TRACCIATO</h2><div class="g" id="presets"><button data-p="clean" class="active">clean</button><button data-p="blocks">mattoncini</button><button data-p="rough">irregolare</button><button data-p="pencil">matita</button></div><div class="row"><label>Spessore</label><span id="thicknessV"></span></div><input id="thickness" type="range" min="1" max="14" step=".1" value="6"><div class="row"><label>Irregolarità</label><span id="roughV"></span></div><input id="rough" type="range" min="0" max="1" step=".01" value=".08"><div class="row"><label>Scala</label><span id="scaleV"></span></div><input id="scale" type="range" min=".4" max="1.3" step=".01" value=".82"><input id="baseColor" type="color" value="#090909"></section><section class="sec"><h2>02 · TYPE</h2><input id="tagline" value="movimento e pensiero" style="width:100%"><select id="font" style="width:100%;margin-top:5px"><option>Roboto Flex</option><option selected>Helvetica Now Display</option><option>Arial Narrow</option><option>Courier New</option></select><select id="layout" style="width:100%;margin-top:5px"><option value="free">lineare</option><option value="twoline">due righe</option><option value="arc">ARC · segue il LOOP</option></select><div class="row"><label>Peso</label><span id="weightV"></span></div><input id="weight" type="range" min="100" max="1000" step="10" value="200"><div class="row"><label>Dimensione</label><span id="sizeV"></span></div><input id="size" type="range" min="12" max="100" value="32"><div class="row"><label>Tracking</label><span id="trackingV"></span></div><input id="tracking" type="range" min="-3" max="18" step=".5" value="3"><label><input id="textBg" type="checkbox"> highlight rosso dietro al testo</label><div id="arcCtl" class="arc"><div class="row"><label>Posizione curva</label><span id="arcStartV"></span></div><input id="arcStart" type="range" min="0" max="100" value="5"><div class="row"><label>Distanza linea</label><span id="arcOffsetV"></span></div><input id="arcOffset" type="range" min="-100" max="100" value="-28"><label><input id="arcReverse" type="checkbox"> direzione inversa</label></div></section><section class="sec"><h2>03 · ELECTRIC / LIVE</h2><div class="g4"><button id="electric">ELECTRIC</button><button id="strobe">STROBO BG</button><button id="mic">MIC</button><button id="draw">DRAW</button></div><div class="row"><label>Velocità DRAW</label><span id="drawSpeedV"></span></div><input id="drawSpeed" type="range" min=".1" max="3" step=".1" value="1"><label><input id="drawLoop" type="checkbox"> draw in loop</label><div class="row"><label>Velocità strobo</label><span id="strobeSpeedV"></span></div><input id="strobeSpeed" type="range" min="1" max="8" step=".25" value="3"><div class="status" id="status">DRAW: dall’estremo alto a sinistra verso l’estremo opposto</div></section><section class="sec"><h2>04 · ECHO</h2><label><input id="echo" type="checkbox" checked> ripeti LOOP</label><div class="row"><label>Ripetizioni</label><span id="echoCountV"></span></div><input id="echoCount" type="range" min="1" max="20" value="3"><div class="row"><label>Passo X</label><span id="echoXV"></span></div><input id="echoX" type="range" min="-100" max="100" value="-8"><div class="row"><label>Passo Y</label><span id="echoYV"></span></div><input id="echoY" type="range" min="-100" max="100" value="2"><input id="red" type="color" value="#ef4b32"></section><section class="sec"><h2>05 · BG MEDUSA / FILAMENTI</h2><label><input id="blobs" type="checkbox" checked> blob azzurri morbidi</label><div class="row"><label>Numero blob</label><span id="blobCountV"></span></div><input id="blobCount" type="range" min="1" max="12" value="5"><div class="row"><label>Velocità</label><span id="blobSpeedV"></span></div><input id="blobSpeed" type="range" min="0" max="2" step=".05" value=".45"><input id="blue" type="color" value="#a9c1f5"><hr><label><input id="filaments" type="checkbox" checked> filamenti sottili</label><div class="row"><label>Numero filamenti</label><span id="filamentCountV"></span></div><input id="filamentCount" type="range" min="1" max="24" value="9"><div class="row"><label>Opacità</label><span id="filamentOpacityV"></span></div><input id="filamentOpacity" type="range" min=".03" max=".8" step=".01" value=".28"><select id="filamentColor" style="width:100%;margin-top:5px"><option value="red">rosso</option><option value="white">bianco</option><option value="blue">azzurro</option><option value="black">nero</option></select></section><div class="out"><div class="g"><button id="png" class="primary">LOGO PNG · TRASP</button><button id="canvas" class="primary">SAVE CANVAS PNG</button><button id="saveDefault">★ SET AS DEFAULT</button><button id="factory">FACTORY DEFAULT</button><button id="save">★ SAVE CANVAS</button><button id="resetCurrent">RESET CURRENT</button><div id="defaultStatus" class="defaultStatus">default: factory</div></div></div></aside></div><svg width="0" height="0"><path id="mp"/></svg><script>const D=`M117.35 102.10C131 82 158 43 178.5 25C194 11.5 208 17 209 35.5C210 54.5 192.5 65.5 172 64.5C149.5 63.5 132.5 54.5 122.4 49.4C116 45.8 112.8 38 114.2 31.8C115.8 24.7 123.1 21.6 128.7 24.7C135.1 28.2 136.2 36.3 131.6 41.8C126.8 47.5 117.9 50.6 105.5 51.2C93.1 51.8 84.2 54.9 79.4 60.6C74.8 66.1 75.9 74.2 82.3 77.7C87.9 80.8 95.2 77.7 96.8 70.6C98.2 64.4 95 56.6 88.6 53C78.5 47.9 61.5 38.9 39 37.9C18.5 36.9 1 47.9 2 66.9C3 85.4 17 90.9 32.5 77.4C53 59.4 80 20.4 93.65 .3`,$=x=>document.getElementById(x),cv=$('cv'),g=cv.getContext('2d'),bg=$('bg'),b=bg.getContext('2d'),mp=$('mp');mp.setAttribute('d',D);const L=mp.getTotalLength(),STORE='loopIdentityLabDefaultsV1';let preset='clean',drawing=false,prog=1,strobe=false,flash=false,electric=false,last=0,bl=[],fl=[];const ids=['thickness','rough','scale','weight','size','tracking','arcStart','arcOffset','drawSpeed','strobeSpeed','echoCount','echoX','echoY','blobCount','blobSpeed','filamentCount','filamentOpacity'];const stateIds=['thickness','rough','scale','baseColor','tagline','font','layout','weight','size','tracking','textBg','arcStart','arcOffset','arcReverse','drawSpeed','drawLoop','strobeSpeed','echo','echoCount','echoX','echoY','red','blobs','blobCount','blobSpeed','blue','filaments','filamentCount','filamentOpacity','filamentColor'];const v=x=>+$(x).value,t=x=>$(x).value;function sync(){ids.forEach(x=>{$(x+'V')&&($(x+'V').textContent=$(x).value)})}function captureState(){let s={preset};stateIds.forEach(id=>{let e=$(id);s[id]=(e.type==='checkbox')?e.checked:e.value});return s}function applyState(s){if(!s)return;stateIds.forEach(id=>{let e=$(id);if(!e||s[id]===undefined)return;if(e.type==='checkbox')e.checked=!!s[id];else e.value=s[id]});if(s.preset){preset=s.preset;document.querySelectorAll('#presets button').forEach(y=>y.classList.toggle('active',y.dataset.p===preset))}sync();makeBG();render();renderBG()}function loadSavedDefault(){try{let raw=localStorage.getItem(STORE);if(!raw)return false;applyState(JSON.parse(raw));$('defaultStatus').textContent='default: salvato nel browser';return true}catch(e){return false}}function P(q){let s=v('scale')*4;return{x:670+(q.x-105)*s,y:414+(q.y-51)*s}}function pts(p=1){let a=[],n=Math.max(2,Math.floor(420*p));for(let i=0;i<=n;i++)a.push(P(mp.getPointAtLength(L-(L*p*i/n))));return a}function path(c,a,col,dx=0,dy=0){c.save();c.strokeStyle=col;c.lineWidth=v('thickness')*7.2;c.lineCap=preset==='blocks'?'butt':'round';c.lineJoin='round';if(preset==='blocks')c.setLineDash([18,7]);if(preset==='pencil')c.setLineDash([3,5]);let reps=preset==='rough'?7:1,j=preset==='rough'?v('rough')*16:0;for(let r=0;r<reps;r++){c.globalAlpha=preset==='rough'?.22:1;c.beginPath();a.forEach((p,i)=>{let x=p.x+dx+Math.sin(i*.7+r*9)*j,y=p.y+dy+Math.cos(i*.6+r*7)*j;i?c.lineTo(x,y):c.moveTo(x,y)});c.stroke()}c.restore()}function font(){g.font=`${v('weight')} ${v('size')}px '${t('font')}'`}function textWidth(s){font();let w=0;for(let ch of s)w+=g.measureText(ch).width+v('tracking');return Math.max(0,w-v('tracking'))}function tracked(s,x,y){font();if($('textBg').checked){let w=textWidth(s);g.fillStyle=t('red');g.beginPath();g.roundRect(x-18,y-v('size')*.9-10,w+36,v('size')+24,30);g.fill()}g.fillStyle='#090909';for(let ch of s){g.fillText(ch,x,y);x+=g.measureText(ch).width+v('tracking')}}function arc(){let cur=v('arcStart')/100*L,dir=$('arcReverse').checked?-1:1,s=t('tagline');font();g.fillStyle='#090909';for(let ch of s){let w=(g.measureText(ch).width+v('tracking'))/(v('scale')*4),m=cur+dir*w/2;if(m<0||m>L)break;let q=mp.getPointAtLength(m),q2=mp.getPointAtLength(Math.max(0,Math.min(L,m+dir))),a=Math.atan2(q2.y-q.y,q2.x-q.x),p=P(q),off=v('arcOffset');g.save();g.translate(p.x-Math.sin(a)*off,p.y+Math.cos(a)*off);g.rotate(a+(dir<0?Math.PI:0));g.textAlign='center';g.textBaseline='middle';g.fillText(ch,0,0);g.restore();cur+=dir*w}}function render(){g.clearRect(0,0,1400,900);let a=pts(prog);if($('echo').checked)for(let i=v('echoCount');i>=1;i--)path(g,a,t('red'),i*v('echoX'),i*v('echoY'));path(g,a,t('baseColor'));let lay=t('layout');if(lay==='arc')arc();else if(lay==='twoline'){tracked('movimento',800,520);tracked('e pensiero',800,565)}else tracked(t('tagline'),800,550);$('arcCtl').classList.toggle('on',lay==='arc')}function blobPoints(o,time){let a=[],n=10;for(let i=0;i<n;i++){let ang=Math.PI*2*i/n,r=o.r*(1+.16*Math.sin(i*2.13+o.seed+time*.00018)+.08*Math.cos(i*3.7-o.seed));a.push({x:o.x+Math.cos(ang)*r,y:o.y+Math.sin(ang)*r*.72})}return a}function organic(o,time){let p=blobPoints(o,time),n=p.length;b.beginPath();for(let i=0;i<n;i++){let prev=p[(i-1+n)%n],cur=p[i],next=p[(i+1)%n],sx=(prev.x+cur.x)/2,sy=(prev.y+cur.y)/2,ex=(cur.x+next.x)/2,ey=(cur.y+next.y)/2;if(i===0)b.moveTo(sx,sy);b.quadraticCurveTo(cur.x,cur.y,ex,ey)}b.closePath();b.fill()}function makeBG(){bl=[];for(let i=0;i<v('blobCount');i++)bl.push({x:Math.random()*1400,y:Math.random()*900,r:110+Math.random()*190,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*1.3,seed:Math.random()*10});fl=[];for(let i=0;i<v('filamentCount');i++)fl.push({y:Math.random()*900,amp:60+Math.random()*180,phase:Math.random()*8})}function filamentCol(){return t('filamentColor')==='white'?'#fff':t('filamentColor')==='blue'?t('blue'):t('filamentColor')==='black'?'#090909':t('red')}function renderBG(ts=0){b.clearRect(0,0,1400,900);b.fillStyle=flash&&strobe?t('red'):'#fff';b.fillRect(0,0,1400,900);if($('blobs').checked){b.fillStyle=t('blue');b.globalAlpha=.28;bl.forEach(o=>organic(o,ts));b.globalAlpha=1}if($('filaments').checked){b.save();b.strokeStyle=filamentCol();b.globalAlpha=v('filamentOpacity');b.lineWidth=1.1;fl.forEach((f,i)=>{b.beginPath();for(let x=-80;x<=1480;x+=24){let y=f.y+Math.sin(x*.005+f.phase+ts*.00012)*f.amp+Math.sin(x*.013+i)*28;x===-80?b.moveTo(x,y):b.lineTo(x,y)}b.stroke()});b.restore()}}function frame(ts){let dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(drawing){prog+=dt*v('drawSpeed')*.35;if(prog>=1){if($('drawLoop').checked)prog=0;else{prog=1;drawing=false;$('draw').classList.remove('active')}}render()}if(strobe&&Math.floor(ts/(500/v('strobeSpeed')))%2!=(flash?1:0))flash=!flash;if($('blobs').checked)bl.forEach(o=>{o.x+=o.vx*v('blobSpeed');o.y+=o.vy*v('blobSpeed');if(o.x<-o.r)o.x=1450;if(o.x>1450)o.x=-o.r;if(o.y<-o.r)o.y=950;if(o.y>950)o.y=-o.r});renderBG(ts);requestAnimationFrame(frame)}$('draw').onclick=()=>{drawing=!drawing;if(drawing&&prog>=1)prog=0;$('draw').classList.toggle('active',drawing);render()};$('strobe').onclick=()=>{strobe=!strobe;flash=false;$('strobe').classList.toggle('active',strobe)};$('electric').onclick=()=>{electric=!electric;$('electric').classList.toggle('active',electric);render()};$('mic').onclick=async()=>{try{let s=await navigator.mediaDevices.getUserMedia({audio:true}),ac=new AudioContext(),an=ac.createAnalyser(),src=ac.createMediaStreamSource(s),d=new Uint8Array(256);an.fftSize=512;src.connect(an);$('mic').classList.add('active');setInterval(()=>{an.getByteFrequencyData(d);flash=d.reduce((a,x)=>a+x,0)/d.length>35},70)}catch(e){$('status').textContent='microfono non disponibile'}};document.querySelectorAll('#presets button').forEach(x=>x.onclick=()=>{preset=x.dataset.p;document.querySelectorAll('#presets button').forEach(y=>y.classList.toggle('active',x===y));render()});document.querySelectorAll('input,select').forEach(x=>x.addEventListener('input',()=>{sync();if(['blobCount','filamentCount'].includes(x.id))makeBG();render();renderBG()}));$('saveDefault').onclick=()=>{try{localStorage.setItem(STORE,JSON.stringify(captureState()));$('defaultStatus').textContent='★ default salvato nel browser'}catch(e){$('defaultStatus').textContent='impossibile salvare il default'}};$('factory').onclick=()=>{localStorage.removeItem(STORE);location.reload()};$('resetCurrent').onclick=()=>{let raw=localStorage.getItem(STORE);if(raw){applyState(JSON.parse(raw));$('defaultStatus').textContent='default: salvato nel browser'}else location.reload()};function dl(q,n){let a=document.createElement('a');a.href=q;a.download=n;a.click()}$('png').onclick=()=>dl(cv.toDataURL('image/png'),'loop-logo-transparent.png');function comp(){let q=document.createElement('canvas');q.width=1400;q.height=900;let x=q.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1400,900);x.drawImage(bg,0,0);x.drawImage(cv,0,0);x.fillStyle=t('red');x.font='22px Arial';x.fillText('♥',1350,860);return q}$('canvas').onclick=()=>dl(comp().toDataURL('image/png'),'loop-canvas.png');$('save').onclick=()=>{let q=document.createElement('canvas');q.width=280;q.height=180;q.getContext('2d').drawImage(comp(),0,0,280,180);$('saved').appendChild(q)};sync();makeBG();renderBG();render();loadSavedDefault();requestAnimationFrame(frame);</script></body></html>
