<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>LOOP — Logo Lab</title>
<style>
:root{--bg:#f6f4ee;--ink:#0a0a0a;--line:#c9c5bb;--panel:#ece8df;--muted:#6d6a63}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.app{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:100vh}.stage{padding:24px;display:flex;flex-direction:column;gap:16px}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:12px}.top h1{margin:0;font-size:18px;letter-spacing:.16em}.top small{color:var(--muted)}.canvas-wrap{flex:1;min-height:620px;border:1px solid var(--line);background:#fff;position:relative;overflow:hidden}.canvas-wrap canvas{width:100%;height:100%;display:block}.saved{display:flex;gap:10px;overflow:auto;padding-bottom:6px}.thumb{width:110px;height:72px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer}.thumb canvas{width:100%;height:100%}aside{border-left:1px solid var(--line);background:var(--panel);padding:18px;overflow:auto}.section{padding:14px 0;border-top:1px solid var(--line)}.section:first-child{border-top:0}.section h2{font-size:11px;letter-spacing:.12em;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:10px 0}.row label{font-size:12px}.row span{font-size:11px;color:var(--muted)}input[type=range]{width:100%}.stack{display:grid;gap:8px}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,select,input[type=text]{font:inherit;border:1px solid #999;background:#fff;color:#111;padding:8px}button{cursor:pointer}.primary{background:#111;color:#fff}.full{grid-column:1/-1}.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.seg button.active{background:#111;color:#fff}.icon-preview{height:120px;border:1px solid var(--line);background:#fff;display:grid;place-items:center}.icon-preview canvas{width:100%;height:100%}@media(max-width:900px){.app{grid-template-columns:1fr}.canvas-wrap{min-height:460px}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <div class="top"><div><h1>LOOP / LOGO LAB</h1><small>simbolo, texture & type</small></div><small id="status">master LOOP</small></div>
    <div class="canvas-wrap"><canvas id="canvas" width="1400" height="900"></canvas></div>
    <div class="saved" id="saved"></div>
  </section>
  <aside>
    <div class="section"><h2>01 · PRESET</h2><div class="seg" id="presetBtns"><button data-preset="clean" class="active">clean</button><button data-preset="charcoal">carboncino</button><button data-preset="spray">spray</button><button data-preset="dry">dry brush</button></div></div>
    <div class="section"><h2>02 · SIMBOLO</h2>
      <div class="row"><label>Spessore</label><span id="thicknessV"></span></div><input id="thickness" type="range" min="0.45" max="2.2" step="0.01" value="1">
      <div class="row"><label>Roughness</label><span id="roughnessV"></span></div><input id="roughness" type="range" min="0" max="1" step="0.01" value="0.15">
      <div class="row"><label>Grain</label><span id="grainV"></span></div><input id="grain" type="range" min="0" max="1" step="0.01" value="0.15">
      <div class="row"><label>Erosion</label><span id="erosionV"></span></div><input id="erosion" type="range" min="0" max="1" step="0.01" value="0.05">
      <div class="row"><label>Scala</label><span id="scaleV"></span></div><input id="scale" type="range" min="0.45" max="1.25" step="0.01" value="0.82">
      <div class="row"><label>Rotazione</label><span id="rotationV"></span></div><input id="rotation" type="range" min="-20" max="20" step="1" value="0">
    </div>
    <div class="section"><h2>03 · STRINGA</h2><div class="stack">
      <input id="tagline" type="text" value="movimento e pensiero">
      <select id="font"><option value="Arial">Arial</option><option value="Helvetica">Helvetica</option><option value="Arial Black">Arial Black</option><option value="Trebuchet MS">Trebuchet MS</option></select>
      <select id="layout"><option value="fragment">frammento</option><option value="continuation">prosecuzione</option><option value="cross">attraversamento</option><option value="orbital">orbitale</option></select>
    </div>
      <div class="row"><label>Dimensione</label><span id="fontSizeV"></span></div><input id="fontSize" type="range" min="18" max="72" value="32">
      <div class="row"><label>Tracking</label><span id="trackingV"></span></div><input id="tracking" type="range" min="0" max="18" value="3">
    </div>
    <div class="section"><h2>04 · ICONA</h2><div class="icon-preview"><canvas id="iconCanvas" width="520" height="220"></canvas></div></div>
    <div class="section"><h2>05 · OUTPUT</h2><div class="btns"><button id="randomBtn">RANDOMIZE</button><button id="saveBtn">★ SAVE</button><button id="pngBtn" class="primary">PNG</button><button id="iconBtn">ICON PNG</button><button id="resetBtn" class="full">RESET</button></div></div>
  </aside>
</div>
<script>
const defaultSVG=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 211 102.4"><path d="M 117.35 102.10 C 131 82,158 43,178.5 25 C 194 11.5,208 17,209 35.5 C 210 54.5,192.5 65.5,172 64.5 C 149.5 63.5,132.5 54.5,122.4 49.4 C 116 45.8,112.8 38,114.2 31.8 C 115.8 24.7,123.1 21.6,128.7 24.7 C 135.1 28.2,136.2 36.3,131.6 41.8 C 126.8 47.5,117.9 50.6,105.5 51.2 C 93.1 51.8,84.2 54.9,79.4 60.6 C 74.8 66.1,75.9 74.2,82.3 77.7 C 87.9 80.8,95.2 77.7,96.8 70.6 C 98.2 64.4,95 56.6,88.6 53 C 78.5 47.9,61.5 38.9,39 37.9 C 18.5 36.9,1 47.9,2 66.9 C 3 85.4,17 90.9,32.5 77.4 C 53 59.4,80 20.4,93.65 .3" fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const img=new Image(); img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(defaultSVG);
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),ic=document.getElementById('iconCanvas'),ictx=ic.getContext('2d');
const ids=['thickness','roughness','grain','erosion','scale','rotation','fontSize','tracking']; const state={preset:'clean'};
function v(id){return +document.getElementById(id).value} function txt(id){return document.getElementById(id).value}
function sync(){ids.forEach(id=>{const el=document.getElementById(id+'V'); if(el) el.textContent=document.getElementById(id).value});}
function seeded(i){const x=Math.sin(i*999+17.13)*43758.5453;return x-Math.floor(x)}
function drawLogo(target,icon=false){const W=target.canvas.width,H=target.canvas.height;target.clearRect(0,0,W,H);target.fillStyle='#fff';target.fillRect(0,0,W,H);const sc=(icon?0.62:v('scale'))*(W/900);const cx=icon?W*0.5:W*0.48, cy=icon?H*0.52:H*0.46;target.save();target.translate(cx,cy);target.rotate(v('rotation')*Math.PI/180);target.scale(sc,sc);const baseW=1.8*v('thickness')*16;const reps=Math.round(1+v('roughness')*9);for(let i=0;i<reps;i++){const j=(seeded(i)-.5)*v('roughness')*9;target.globalAlpha=.94-v('erosion')*.3*seeded(i+4);target.drawImage(img,-430+j,-210+j*.3,860,420)}target.restore();
 const grains=Math.round(v('grain')*2200);target.fillStyle='rgba(0,0,0,.34)';for(let i=0;i<grains;i++){const x=seeded(i+10)*W,y=seeded(i+2000)*H;if(seeded(i+4000)>.74)target.fillRect(x,y,seeded(i+5)*1.8+.2,seeded(i+9)*1.8+.2)}
 if(!icon){drawTagline(target,W,H)} }
function drawTagline(g,W,H){const text=txt('tagline'),size=v('fontSize'),track=v('tracking'),font=txt('font'),layout=txt('layout');g.fillStyle='#111';g.globalAlpha=1;g.font=`600 ${size}px ${font}`;const chars=[...text];const width=chars.reduce((a,ch)=>a+g.measureText(ch).width+track,0)-track;let x=W*.58,y=H*.67,angle=0;if(layout==='continuation'){x=W*.56;y=H*.66;angle=-.08}else if(layout==='cross'){x=W*.5-width/2;y=H*.5;angle=0}else if(layout==='orbital'){g.save();g.translate(W*.5,H*.47);const r=Math.min(W,H)*.28;chars.forEach((ch,i)=>{const a=-2.6+i/(chars.length-1)*2.1;g.save();g.rotate(a+Math.PI/2);g.translate(r,0);g.rotate(Math.PI/2);g.fillText(ch,0,0);g.restore()});g.restore();return}g.save();g.translate(x,y);g.rotate(angle);if(layout==='fragment'){g.fillRect(-90,-size*.35,65,1)}let px=0;chars.forEach(ch=>{g.fillText(ch,px,0);px+=g.measureText(ch).width+track});g.restore()}
function render(){sync();drawLogo(ctx,false);drawLogo(ictx,true)}
function preset(name){state.preset=name;document.querySelectorAll('#presetBtns button').forEach(b=>b.classList.toggle('active',b.dataset.preset===name));const p={clean:[1,.03,.02,.01],charcoal:[.72,.55,.55,.18],spray:[.95,.35,.92,.28],dry:[.82,.72,.38,.22]}[name];['thickness','roughness','grain','erosion'].forEach((id,i)=>document.getElementById(id).value=p[i]);render()}
ids.forEach(id=>document.getElementById(id).addEventListener('input',render));['tagline','font','layout'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.querySelectorAll('#presetBtns button').forEach(b=>b.onclick=()=>preset(b.dataset.preset));
document.getElementById('randomBtn').onclick=()=>{document.getElementById('roughness').value=(Math.random()*.85).toFixed(2);document.getElementById('grain').value=(Math.random()).toFixed(2);document.getElementById('erosion').value=(Math.random()*.35).toFixed(2);document.getElementById('rotation').value=Math.round(Math.random()*12-6);render()};
document.getElementById('saveBtn').onclick=()=>{const d=document.createElement('div');d.className='thumb';const t=document.createElement('canvas');t.width=330;t.height=216;d.appendChild(t);drawLogo(t.getContext('2d'),false);document.getElementById('saved').appendChild(d)};
function dl(canvas,name){const a=document.createElement('a');a.download=name;a.href=canvas.toDataURL('image/png');a.click()}
document.getElementById('pngBtn').onclick=()=>dl(c,'loop-logo.png');document.getElementById('iconBtn').onclick=()=>dl(ic,'loop-icon.png');document.getElementById('resetBtn').onclick=()=>preset('clean');img.onload=render;render();
</script>
</body>
</html>
