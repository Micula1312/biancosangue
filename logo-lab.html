<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOP — Logo Lab</title><style>:root{--bg:#f6f4ee;--ink:#0a0a0a;--line:#c9c5bb;--panel:#ece8df;--muted:#6d6a63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.app{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:100vh}.stage{padding:24px;display:flex;flex-direction:column;gap:16px}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:12px}.top h1{margin:0;font-size:18px;letter-spacing:.16em}.top small,.row span{color:var(--muted)}.canvas-wrap{flex:1;min-height:620px;border:1px solid var(--line);background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}.canvas-wrap canvas{display:block;max-width:100%;max-height:100%;object-fit:contain}.saved{display:flex;gap:10px;overflow:auto}.thumb{width:110px;height:72px;border:1px solid var(--line);background:#fff}.thumb canvas{width:100%;height:100%}aside{border-left:1px solid var(--line);background:var(--panel);padding:18px;overflow:auto}.section{padding:14px 0;border-top:1px solid var(--line)}.section:first-child{border-top:0}.section h2{font-size:11px;letter-spacing:.12em;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:10px 0}.row label{font-size:12px}.row span{font-size:11px}input[type=range]{width:100%}.stack{display:grid;gap:8px}.btns,.seg{display:grid;grid-template-columns:1fr 1fr;gap:7px}button,select,input[type=text]{font:inherit;border:1px solid #999;background:#fff;color:#111;padding:8px}button{cursor:pointer}.primary,.seg button.active{background:#111;color:#fff}.icon-preview{height:120px;border:1px solid var(--line);background:#fff}.icon-preview canvas{width:100%;height:100%}@media(max-width:900px){.app{grid-template-columns:1fr}.canvas-wrap{min-height:460px}aside{border:0;border-top:1px solid var(--line)}}</style></head><body><div class="app"><section class="stage"><div class="top"><div><h1>LOOP / LOGO LAB</h1><small>simbolo, texture & type</small></div><small>canvas 1400×900 fisso</small></div><div class="canvas-wrap"><canvas id="canvas" width="1400" height="900"></canvas></div><div class="saved" id="saved"></div></section><aside><div class="section"><h2>01 · TRATTO</h2><div class="seg" id="presetBtns"><button data-preset="clean" class="active">clean</button><button data-preset="charcoal">carboncino</button><button data-preset="spray">spray</button><button data-preset="dry">dry brush</button></div></div><div class="section"><h2>02 · SIMBOLO</h2><div class="row"><label>Spessore</label><span id="thicknessV"></span></div><input id="thickness" type="range" min="0.35" max="10" step="0.01" value="1"><div class="row"><label>Roughness</label><span id="roughnessV"></span></div><input id="roughness" type="range" min="0" max="1" step=".01" value=".03"><div class="row"><label>Grain</label><span id="grainV"></span></div><input id="grain" type="range" min="0" max="1" step=".01" value=".02"><div class="row"><label>Erosion</label><span id="erosionV"></span></div><input id="erosion" type="range" min="0" max="1" step=".01" value=".01"><div class="row"><label>Scala</label><span id="scaleV"></span></div><input id="scale" type="range" min=".45" max="1.25" step=".01" value=".82"><div class="row"><label>Rotazione</label><span id="rotationV"></span></div><input id="rotation" type="range" min="-20" max="20" step="1" value="0"></div><div class="section"><h2>03 · STRINGA</h2><div class="stack"><input id="tagline" type="text" value="movimento e pensiero"><select id="font"><option>Arial</option><option>Helvetica</option><option value="Courier New">Courier New</option><option>Courier</option><option value="Trebuchet MS">Trebuchet MS</option></select><select id="layout"><option value="fragment">frammento</option><option value="continuation">prosecuzione</option><option value="cross">attraversamento</option><option value="twoline">a fianco · movimento / e pensiero</option><option value="twolineReverse">a fianco · pensiero / e movimento</option><option value="orbital">orbitale</option></select></div><div class="row"><label>Dimensione</label><span id="fontSizeV"></span></div><input id="fontSize" type="range" min="18" max="72" value="32"><div class="row"><label>Tracking</label><span id="trackingV"></span></div><input id="tracking" type="range" min="0" max="18" value="3"><div class="row"><label>Traslazione laterale X</label><span id="textXV"></span></div><input id="textX" type="range" min="-500" max="500" step="1" value="0"><div class="row"><label>Traslazione verticale Y</label><span id="textYV"></span></div><input id="textY" type="range" min="-350" max="350" step="1" value="0"></div><div class="section"><h2>04 · ICONA</h2><div class="icon-preview"><canvas id="iconCanvas" width="520" height="220"></canvas></div></div><div class="section"><h2>05 · OUTPUT</h2><div class="btns"><button id="randomBtn">RANDOMIZE</button><button id="saveBtn">★ SAVE</button><button id="pngBtn" class="primary">PNG TRASP.</button><button id="svgBtn" class="primary">SVG COMPLETO</button><button id="iconBtn">ICON PNG</button><button id="resetBtn">RESET</button></div></div></aside></div><script>
const pathD="M 117.35 102.10 C 131 82,158 43,178.5 25 C 194 11.5,208 17,209 35.5 C 210 54.5,192.5 65.5,172 64.5 C 149.5 63.5,132.5 54.5,122.4 49.4 C 116 45.8,112.8 38,114.2 31.8 C 115.8 24.7,123.1 21.6,128.7 24.7 C 135.1 28.2,136.2 36.3,131.6 41.8 C 126.8 47.5,117.9 50.6,105.5 51.2 C 93.1 51.8,84.2 54.9,79.4 60.6 C 74.8 66.1,75.9 74.2,82.3 77.7 C 87.9 80.8,95.2 77.7,96.8 70.6 C 98.2 64.4,95 56.6,88.6 53 C 78.5 47.9,61.5 38.9,39 37.9 C 18.5 36.9,1 47.9,2 66.9 C 3 85.4,17 90.9,32.5 77.4 C 53 59.4,80 20.4,93.65 .3";const c=document.getElementById('canvas'),ctx=c.getContext('2d'),ic=document.getElementById('iconCanvas'),ictx=ic.getContext('2d');const ids=['thickness','roughness','grain','erosion','scale','rotation','fontSize','tracking','textX','textY'];let activePreset='clean';function v(id){return +document.getElementById(id).value}function txt(id){return document.getElementById(id).value}function seeded(i){let x=Math.sin(i*91.731+13.17)*43758.5453;return x-Math.floor(x)}function sync(){ids.forEach(id=>{let e=document.getElementById(id+'V');if(e)e.textContent=document.getElementById(id).value})}function symbolSVG(sw){const pad=Math.max(24,sw*5);return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-pad} ${-pad} ${211+pad*2} ${102.4+pad*2}" overflow="visible"><path d="${pathD}" fill="none" stroke="#000" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></svg>`}function imgFor(sw){let im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(symbolSVG(sw));return im}
function drawLogo(g,icon=false,transparent=false){const W=g.canvas.width,H=g.canvas.height;g.clearRect(0,0,W,H);if(!transparent){g.fillStyle='#fff';g.fillRect(0,0,W,H)}const thick=v('thickness'),rough=v('roughness'),grain=v('grain'),eros=v('erosion'),sw=1.8*thick,pad=Math.max(24,sw*5),im=imgFor(sw);im.onload=()=>{const sc=(icon?.62:v('scale'))*(W/900),cx=icon?W*.5:W*.48,cy=icon?H*.52:H*.46;g.save();g.translate(cx,cy);g.rotate(v('rotation')*Math.PI/180);g.scale(sc,sc);let reps=1,jitter=0,alpha=.98;if(activePreset==='charcoal'){reps=5+Math.round(rough*12);jitter=3+rough*18;alpha=.2}else if(activePreset==='spray'){reps=2+Math.round(rough*5);jitter=4+rough*24;alpha=.45}else if(activePreset==='dry'){reps=3+Math.round(rough*8);jitter=2+rough*13;alpha=.35}const drawW=860+pad*8,drawH=420+pad*8;for(let i=0;i<reps;i++){let j=(seeded(i)-.5)*jitter;g.globalAlpha=activePreset==='clean'?1:Math.max(.08,alpha*(1-eros*.5));g.drawImage(im,-drawW/2+j,-drawH/2+(seeded(i+40)-.5)*jitter,drawW,drawH)}g.restore();g.globalAlpha=1;if(activePreset!=='clean'){let count=Math.round(grain*(activePreset==='spray'?8500:activePreset==='charcoal'?4000:2300));g.fillStyle=activePreset==='spray'?'rgba(0,0,0,.28)':'rgba(0,0,0,.18)';let spread=activePreset==='spray'?330:230;for(let i=0;i<count;i++){let x=W*.48+(seeded(i+100)-.5)*W*.75,y=H*.46+(seeded(i+5000)-.5)*spread*2.2,r=activePreset==='spray'?.4+seeded(i+9000)*2.6:.3+seeded(i+9000)*1.5;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}}if(!icon)drawTagline(g,W,H)}}
function tracked(g,text,x,y,track){let px=x;[...text].forEach(ch=>{g.fillText(ch,px,y);px+=g.measureText(ch).width+track})}function drawTagline(g,W,H){let text=txt('tagline'),size=v('fontSize'),track=v('tracking'),font=txt('font'),layout=txt('layout'),dx=v('textX'),dy=v('textY');g.fillStyle='#111';g.globalAlpha=1;g.font=`600 ${size}px "${font}"`;if(layout==='twoline'||layout==='twolineReverse'){let lines=layout==='twoline'?['movimento','e pensiero']:['pensiero','e movimento'],x=W*.69+dx,y=H*.45+dy;tracked(g,lines[0],x,y,track);tracked(g,lines[1],x,y+size*1.18,track);return}let chars=[...text],width=chars.reduce((a,ch)=>a+g.measureText(ch).width+track,0)-track,x=W*.58+dx,y=H*.67+dy,angle=0;if(layout==='continuation'){x=W*.56+dx;y=H*.66+dy;angle=-.08}else if(layout==='cross'){x=W*.5-width/2+dx;y=H*.5+dy}else if(layout==='orbital'){g.save();g.translate(W*.5+dx,H*.47+dy);let r=Math.min(W,H)*.28;chars.forEach((ch,i)=>{let a=-2.6+i/Math.max(1,chars.length-1)*2.1;g.save();g.rotate(a+Math.PI/2);g.translate(r,0);g.rotate(Math.PI/2);g.fillText(ch,0,0);g.restore()});g.restore();return}g.save();g.translate(x,y);g.rotate(angle);if(layout==='fragment')g.fillRect(-90,-size*.35,65,1);tracked(g,text,0,0,track);g.restore()}
function render(){sync();drawLogo(ctx);drawLogo(ictx,true)}function preset(n){activePreset=n;document.querySelectorAll('#presetBtns button').forEach(b=>b.classList.toggle('active',b.dataset.preset===n));let p={clean:[1,.02,.01,.01],charcoal:[1.45,.72,.68,.22],spray:[1.05,.58,1,.18],dry:[1.8,.88,.42,.48]}[n];['thickness','roughness','grain','erosion'].forEach((id,i)=>document.getElementById(id).value=p[i]);render()}ids.forEach(id=>document.getElementById(id).addEventListener('input',render));['tagline','font','layout'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.querySelectorAll('#presetBtns button').forEach(b=>b.onclick=()=>preset(b.dataset.preset));document.getElementById('randomBtn').onclick=()=>{document.getElementById('thickness').value=(.5+Math.random()*8.5).toFixed(2);document.getElementById('roughness').value=Math.random().toFixed(2);document.getElementById('grain').value=Math.random().toFixed(2);document.getElementById('erosion').value=(Math.random()*.7).toFixed(2);render()};document.getElementById('saveBtn').onclick=()=>{let d=document.createElement('div'),t=document.createElement('canvas');d.className='thumb';t.width=330;t.height=216;d.appendChild(t);document.getElementById('saved').appendChild(d);drawLogo(t.getContext('2d'))};function downloadBlob(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.getElementById('pngBtn').onclick=()=>{let o=document.createElement('canvas');o.width=1400;o.height=900;drawLogo(o.getContext('2d'),false,true);setTimeout(()=>o.toBlob(b=>downloadBlob(b,'loop-logo-transparent.png'),'image/png'),180)};document.getElementById('iconBtn').onclick=()=>{let o=document.createElement('canvas');o.width=520;o.height=220;drawLogo(o.getContext('2d'),true,true);setTimeout(()=>o.toBlob(b=>downloadBlob(b,'loop-icon-transparent.png'),'image/png'),180)};function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}document.getElementById('svgBtn').onclick=()=>{let layout=txt('layout'),font=esc(txt('font')),size=v('fontSize'),track=v('tracking'),dx=v('textX')*.7,dy=v('textY')*.55,sw=1.8*v('thickness'),sc=v('scale')*4.5,rot=v('rotation'),symbol=`<g transform="translate(250 170) rotate(${rot}) scale(${sc}) translate(-105.5 -51.2)"><path d="${pathD}" fill="none" stroke="#000" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></g>`,tag='';if(layout==='twoline'||layout==='twolineReverse'){let a=layout==='twoline'?'movimento':'pensiero',b=layout==='twoline'?'e pensiero':'e movimento';tag=`<text x="${690+dx}" y="${215+dy}" font-family="${font}" font-size="${size}" font-weight="600" letter-spacing="${track}"><tspan x="${690+dx}" dy="0">${a}</tspan><tspan x="${690+dx}" dy="${size*1.18}">${b}</tspan></text>`}else{let text=esc(txt('tagline'));tag=`<text x="${565+dx}" y="${325+dy}" font-family="${font}" font-size="${size}" font-weight="600" letter-spacing="${track}">${text}</text>`}let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" overflow="visible">${symbol}${tag}</svg>`;downloadBlob(new Blob([svg],{type:'image/svg+xml'}),'loop-logo-completo.svg')};document.getElementById('resetBtn').onclick=()=>{document.getElementById('textX').value=0;document.getElementById('textY').value=0;preset('clean')};render();</script></body></html>
