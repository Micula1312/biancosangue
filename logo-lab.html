<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOOP — Logo Lab</title><style>
:root{--bg:#f5f2eb;--ink:#0a0a0a;--line:#c8c3b9;--panel:#ebe7de;--muted:#706b62}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.app{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 360px}.stage{min-width:0;padding:16px;display:grid;grid-template-rows:auto minmax(0,1fr) 78px;gap:12px}.top{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:10px}.top h1{margin:0;font-size:17px;letter-spacing:.16em}.top small,.row span{color:var(--muted)}.canvas-wrap{min-height:0;border:1px solid var(--line);background:#fff;display:grid;place-items:center;overflow:hidden;padding:12px}.canvas-wrap canvas{display:block;width:min(100%,calc((100vh - 150px)*1.5556));height:auto;max-height:100%;aspect-ratio:14/9;object-fit:contain}.saved{display:flex;gap:8px;overflow:auto;align-items:center}.thumb{flex:0 0 112px;height:70px;border:1px solid var(--line);background:#fff}.thumb canvas{width:100%;height:100%}aside{height:100vh;border-left:1px solid var(--line);background:var(--panel);padding:0 16px 150px;overflow-y:auto;position:relative}.section{padding:14px 0;border-top:1px solid var(--line)}.section:first-child{border-top:0}.section h2{font-size:10px;letter-spacing:.14em;margin:0 0 10px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:8px 0}.row label{font-size:12px}.row span{font-size:10px}input[type=range]{width:100%}.stack{display:grid;gap:7px}.btns,.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.materials{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}button,select,input[type=text],input[type=color]{font:inherit;border:1px solid #999;background:#fff;color:#111;padding:7px;min-width:0}button{cursor:pointer;font-size:11px}.primary,.seg button.active,.materials button.active{background:#111;color:#fff}.icon-preview{height:100px;border:1px solid var(--line);background:#fff}.icon-preview canvas{width:100%;height:100%}.output{position:fixed;right:0;bottom:0;width:360px;padding:12px 16px;background:var(--panel);border-top:1px solid var(--line);z-index:5}.swatchrow{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:center;font-size:12px}@media(max-width:900px){html,body{height:auto;overflow:auto}.app{height:auto;display:block}.stage{height:auto;display:block}.top{margin-bottom:12px}.canvas-wrap{height:auto;aspect-ratio:14/9;padding:8px}.canvas-wrap canvas{width:100%;height:auto;max-height:none}.saved{height:80px;margin-top:10px}aside{height:auto;overflow:visible;border:0;border-top:1px solid var(--line);padding-bottom:130px}.output{width:100%}}
</style></head><body><div class="app"><section class="stage"><div class="top"><div><h1>LOOP / LOGO LAB</h1><small>segno · materia · type</small></div><small>preview responsive · export 1400×900</small></div><div class="canvas-wrap"><canvas id="canvas" width="1400" height="900"></canvas></div><div class="saved" id="saved"></div></section><aside>
<div class="section"><h2>01 · TRATTO</h2><div class="seg" id="presetBtns"><button data-preset="clean" class="active">clean</button><button data-preset="charcoal">carboncino</button><button data-preset="spray">spray</button><button data-preset="dry">dry brush</button></div></div>
<div class="section"><h2>02 · MATERIA</h2><div class="materials" id="materialBtns"><button data-material="flat" class="active">flat</button><button data-material="plastic">plastic</button><button data-material="rubber">gomma</button><button data-material="chrome">chrome</button><button data-material="metal">metal</button><button data-material="depth">3D</button></div><div class="row"><label>Profondità</label><span id="depthV"></span></div><input id="depth" type="range" min="0" max="60" step="1" value="18"><div class="row"><label>Luce / specularità</label><span id="shineV"></span></div><input id="shine" type="range" min="0" max="1" step=".01" value=".65"><div class="swatchrow"><label>Colore base</label><input id="baseColor" type="color" value="#111111"></div></div>
<div class="section"><h2>03 · SIMBOLO</h2><div class="row"><label>Spessore</label><span id="thicknessV"></span></div><input id="thickness" type="range" min=".35" max="10" step=".01" value="1"><div class="row"><label>Roughness</label><span id="roughnessV"></span></div><input id="roughness" type="range" min="0" max="1" step=".01" value=".03"><div class="row"><label>Erosion</label><span id="erosionV"></span></div><input id="erosion" type="range" min="0" max="1" step=".01" value=".01"><div class="row"><label>Scala</label><span id="scaleV"></span></div><input id="scale" type="range" min=".45" max="1.25" step=".01" value=".82"><div class="row"><label>Rotazione</label><span id="rotationV"></span></div><input id="rotation" type="range" min="-20" max="20" step="1" value="0"></div>
<div class="section"><h2>04 · STRINGA</h2><div class="stack"><input id="tagline" type="text" value="movimento e pensiero"><select id="font"><option>Arial</option><option>Helvetica</option><option value="Arial Narrow">Arial Narrow</option><option value="Courier New">Courier New</option><option>Courier</option><option value="Trebuchet MS">Trebuchet MS</option></select><select id="layout"><option value="fragment">frammento</option><option value="continuation">prosecuzione</option><option value="cross">attraversamento</option><option value="twoline">a fianco · movimento / e pensiero</option><option value="twolineReverse">a fianco · pensiero / e movimento</option><option value="orbital">orbitale</option></select></div><div class="row"><label>Dimensione</label><span id="fontSizeV"></span></div><input id="fontSize" type="range" min="18" max="72" value="32"><div class="row"><label>Tracking</label><span id="trackingV"></span></div><input id="tracking" type="range" min="0" max="18" value="3"><div class="row"><label>Traslazione X</label><span id="textXV"></span></div><input id="textX" type="range" min="-500" max="500" value="0"><div class="row"><label>Traslazione Y</label><span id="textYV"></span></div><input id="textY" type="range" min="-350" max="350" value="0"></div>
<div class="section"><h2>05 · ICONA</h2><div class="icon-preview"><canvas id="iconCanvas" width="520" height="220"></canvas></div></div><div class="output"><div class="btns"><button id="randomBtn">RANDOMIZE</button><button id="saveBtn">★ SAVE</button><button id="pngBtn" class="primary">PNG TRASP.</button><button id="svgBtn" class="primary">SVG COMPLETO</button><button id="iconBtn">ICON PNG</button><button id="resetBtn">RESET</button></div></div></aside></div><script>
const pathD="M 117.35 102.10 C 131 82,158 43,178.5 25 C 194 11.5,208 17,209 35.5 C 210 54.5,192.5 65.5,172 64.5 C 149.5 63.5,132.5 54.5,122.4 49.4 C 116 45.8,112.8 38,114.2 31.8 C 115.8 24.7,123.1 21.6,128.7 24.7 C 135.1 28.2,136.2 36.3,131.6 41.8 C 126.8 47.5,117.9 50.6,105.5 51.2 C 93.1 51.8,84.2 54.9,79.4 60.6 C 74.8 66.1,75.9 74.2,82.3 77.7 C 87.9 80.8,95.2 77.7,96.8 70.6 C 98.2 64.4,95 56.6,88.6 53 C 78.5 47.9,61.5 38.9,39 37.9 C 18.5 36.9,1 47.9,2 66.9 C 3 85.4,17 90.9,32.5 77.4 C 53 59.4,80 20.4,93.65 .3";
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),ic=document.getElementById('iconCanvas'),ictx=ic.getContext('2d');const ids=['thickness','roughness','erosion','scale','rotation','fontSize','tracking','textX','textY','depth','shine'];let activePreset='clean',material='flat';function v(id){return +document.getElementById(id).value}function txt(id){return document.getElementById(id).value}function sync(){ids.forEach(id=>{let e=document.getElementById(id+'V');if(e)e.textContent=document.getElementById(id).value})}function hexRgb(h){let n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255]}function rgba(h,a=1){let q=hexRgb(h);return `rgba(${q[0]},${q[1]},${q[2]},${a})`}
function symbolSVG(sw,color='#000'){const pad=Math.max(24,sw*5);return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${-pad} ${-pad} ${211+pad*2} ${102.4+pad*2}"><path d="${pathD}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></svg>`}function imgFor(sw,color){let im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(symbolSVG(sw,color));return im}
function materialPaint(g,W,H,base){let s=v('shine');if(material==='flat')return base;if(material==='rubber'){let q=hexRgb(base);return `rgb(${q.map(x=>Math.round(x*.55)).join(',')})`}let gr=g.createLinearGradient(W*.18,H*.2,W*.8,H*.75);if(material==='plastic'){gr.addColorStop(0,base);gr.addColorStop(.34,'#fff');gr.addColorStop(.48,base);gr.addColorStop(1,rgba(base,.85));return gr}if(material==='chrome'){gr.addColorStop(0,'#080808');gr.addColorStop(.18,'#f7f7f7');gr.addColorStop(.32,'#555');gr.addColorStop(.48,'#fff');gr.addColorStop(.62,'#151515');gr.addColorStop(.8,'#d9e7ef');gr.addColorStop(1,'#333');return gr}if(material==='metal'){gr.addColorStop(0,'#202020');gr.addColorStop(.28,'#a9a9a9');gr.addColorStop(.5,'#3d3d3d');gr.addColorStop(.7,'#dedede');gr.addColorStop(1,'#555');return gr}return base}
function makeMask(W,H,icon=false){let m=document.createElement('canvas');m.width=W;m.height=H;let g=m.getContext('2d'),sw=1.8*v('thickness'),im=imgFor(sw,'#000');return new Promise(res=>{im.onload=()=>{let sc=(icon?.62:v('scale'))*(W/900),cx=icon?W*.5:W*.48,cy=icon?H*.52:H*.46,pad=Math.max(24,sw*5),dw=860+pad*8,dh=420+pad*8;g.save();g.translate(cx,cy);g.rotate(v('rotation')*Math.PI/180);g.scale(sc,sc);let reps=activePreset==='clean'?1:activePreset==='charcoal'?9:activePreset==='spray'?5:7,jit=activePreset==='clean'?0:3+v('roughness')*18;for(let i=0;i<reps;i++){g.globalAlpha=activePreset==='clean'?1:.22;g.drawImage(im,-dw/2+(Math.sin(i*31)*jit),-dh/2+(Math.cos(i*19)*jit),dw,dh)}g.restore();res(m)}})}
async function drawLogo(g,icon=false,transparent=false){const W=g.canvas.width,H=g.canvas.height;g.clearRect(0,0,W,H);if(!transparent){g.fillStyle='#fff';g.fillRect(0,0,W,H)}let mask=await makeMask(W,H,icon),layer=document.createElement('canvas');layer.width=W;layer.height=H;let l=layer.getContext('2d'),base=document.getElementById('baseColor').value,dep=v('depth');if(material==='depth'||material==='plastic'||material==='rubber'){for(let i=Math.round(dep);i>0;i--){l.globalAlpha=material==='depth'?.16:.06;l.drawImage(mask,i*.7,i*.7)}}l.globalAlpha=1;l.fillStyle=materialPaint(l,W,H,base);l.fillRect(0,0,W,H);l.globalCompositeOperation='destination-in';l.drawImage(mask,0,0);l.globalCompositeOperation='source-over';if(material==='plastic'&&v('shine')>.05){l.globalAlpha=.28*v('shine');l.filter='blur(5px)';l.drawImage(mask,-5,-7);l.filter='none';l.globalAlpha=1}g.drawImage(layer,0,0);if(!icon)drawTagline(g,W,H)}
function tracked(g,text,x,y,track){let px=x;[...text].forEach(ch=>{g.fillText(ch,px,y);px+=g.measureText(ch).width+track})}function drawTagline(g,W,H){let text=txt('tagline'),size=v('fontSize'),track=v('tracking'),font=txt('font'),layout=txt('layout'),dx=v('textX'),dy=v('textY');g.fillStyle='#111';g.font=`600 ${size}px "${font}"`;if(layout==='twoline'||layout==='twolineReverse'){let lines=layout==='twoline'?['movimento','e pensiero']:['pensiero','e movimento'],x=W*.69+dx,y=H*.45+dy;tracked(g,lines[0],x,y,track);tracked(g,lines[1],x,y+size*1.18,track);return}let width=[...text].reduce((a,ch)=>a+g.measureText(ch).width+track,0)-track,x=W*.58+dx,y=H*.67+dy,angle=0;if(layout==='continuation'){x=W*.56+dx;y=H*.66+dy;angle=-.08}else if(layout==='cross'){x=W*.5-width/2+dx;y=H*.5+dy}else if(layout==='orbital'){g.save();g.translate(W*.5+dx,H*.47+dy);let chars=[...text],r=Math.min(W,H)*.28;chars.forEach((ch,i)=>{let a=-2.6+i/Math.max(1,chars.length-1)*2.1;g.save();g.rotate(a+Math.PI/2);g.translate(r,0);g.rotate(Math.PI/2);g.fillText(ch,0,0);g.restore()});g.restore();return}g.save();g.translate(x,y);g.rotate(angle);if(layout==='fragment')g.fillRect(-90,-size*.35,65,1);tracked(g,text,0,0,track);g.restore()}
function render(){sync();drawLogo(ctx);drawLogo(ictx,true)}function preset(n){activePreset=n;document.querySelectorAll('#presetBtns button').forEach(b=>b.classList.toggle('active',b.dataset.preset===n));let p={clean:[1,.02,.01],charcoal:[1.45,.72,.22],spray:[1.05,.58,.18],dry:[1.8,.88,.48]}[n];['thickness','roughness','erosion'].forEach((id,i)=>document.getElementById(id).value=p[i]);render()}ids.forEach(id=>document.getElementById(id).addEventListener('input',render));['tagline','font','layout','baseColor'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.querySelectorAll('#presetBtns button').forEach(b=>b.onclick=()=>preset(b.dataset.preset));document.querySelectorAll('#materialBtns button').forEach(b=>b.onclick=()=>{material=b.dataset.material;document.querySelectorAll('#materialBtns button').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('randomBtn').onclick=()=>{document.getElementById('thickness').value=(.5+Math.random()*8.5).toFixed(2);document.getElementById('roughness').value=Math.random().toFixed(2);render()};document.getElementById('saveBtn').onclick=()=>{let d=document.createElement('div'),t=document.createElement('canvas');d.className='thumb';t.width=330;t.height=216;d.appendChild(t);document.getElementById('saved').appendChild(d);drawLogo(t.getContext('2d'))};function dl(blob,name){let a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}document.getElementById('pngBtn').onclick=async()=>{let o=document.createElement('canvas');o.width=1400;o.height=900;await drawLogo(o.getContext('2d'),false,true);o.toBlob(b=>dl(b,'loop-logo-transparent.png'),'image/png')};document.getElementById('iconBtn').onclick=async()=>{let o=document.createElement('canvas');o.width=520;o.height=220;await drawLogo(o.getContext('2d'),true,true);o.toBlob(b=>dl(b,'loop-icon-transparent.png'),'image/png')};function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}document.getElementById('svgBtn').onclick=()=>{let sw=1.8*v('thickness'),sc=v('scale')*4.5,rot=v('rotation'),base=document.getElementById('baseColor').value,text=esc(txt('tagline')),font=esc(txt('font')),size=v('fontSize'),track=v('tracking'),dx=v('textX'),dy=v('textY');let defs='',stroke=base;if(material==='chrome'||material==='metal'||material==='plastic'){defs=`<defs><linearGradient id="mat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${material==='chrome'?'#111':base}"/><stop offset=".32" stop-color="#eee"/><stop offset=".55" stop-color="${material==='chrome'?'#333':base}"/><stop offset=".78" stop-color="#fff"/><stop offset="1" stop-color="${material==='chrome'?'#555':base}"/></linearGradient></defs>`;stroke='url(#mat)'}let symbol=`<g transform="translate(672 414) rotate(${rot}) scale(${sc}) translate(-105.5 -51.2)"><path d="${pathD}" fill="none" stroke="${stroke}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></g>`;let tag=`<text x="${812+dx}" y="${603+dy}" font-family="${font}" font-size="${size}" font-weight="600" letter-spacing="${track}">${text}</text>`;let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">${defs}${symbol}${tag}</svg>`;dl(new Blob([svg],{type:'image/svg+xml'}),'loop-logo-completo.svg')};document.getElementById('resetBtn').onclick=()=>{material='flat';document.querySelectorAll('#materialBtns button').forEach(b=>b.classList.toggle('active',b.dataset.material==='flat'));document.getElementById('textX').value=0;document.getElementById('textY').value=0;preset('clean')};render();
</script></body></html>
